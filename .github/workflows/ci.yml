name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.11"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      # Fails on copyleft runtime licences (AGPL/GPL) that would conflict with MIT; LGPL is allowed.
      - run: uv run --with pip-licenses==5.5.5 pip-licenses --from=mixed --partial-match
          --allow-only="MIT;BSD;Apache;ISC;PSF;Python Software Foundation;Mozilla Public License 2.0;LGPL;Lesser General Public;0BSD;Zlib;CC0"
